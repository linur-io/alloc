name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang clang-format
      - run: make test CC=clang
      - run: make clean && make test CC=gcc
      - run: make cross
      - run: make format-check
